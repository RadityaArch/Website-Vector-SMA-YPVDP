  <rect x="495" y="257" width="86" height="86" rx="2" fill="#EBF2FC" stroke="#C5D7F0"/>
  <rect x="594" y="257" width="86" height="86" rx="2" fill="#EBF2FC" stroke="#C5D7F0"/>
  <rect x="495" y="356" width="185" height="86" rx="2" fill="#0B1F3A"/>
