<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0A1D37"/>
      <stop offset="55%" stop-color="#112C52"/>
      <stop offset="100%" stop-color="#163A6B"/>
    </linearGradient>
    <linearGradient id="pcb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#061224"/>
      <stop offset="100%" stop-color="#091B34"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" stroke="#3B82F6" stroke-opacity="0.14" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>

  <!-- Subtle architectural radial illumination -->
  <circle cx="880" cy="240" r="320" fill="#2563EB" fill-opacity="0.16"/>
  <circle cx="280" cy="520" r="260" fill="#0284C7" fill-opacity="0.12"/>

  <!-- Workbench surface plane -->
  <path d="M 70 500 L 1130 500 L 1170 620 L 30 620 Z" fill="#0D2342" stroke="#2D558F" stroke-width="1.5"/>
  <line x1="70" y1="500" x2="1130" y2="500" stroke="#60A5FA" stroke-opacity="0.35" stroke-width="2"/>

  <!-- Blueprint schematic sheet on desk -->
  <g transform="translate(115, 290) rotate(-3)">
    <rect x="0" y="0" width="360" height="230" rx="2" fill="#0F294D" stroke="#3B82F6" stroke-opacity="0.45" stroke-width="1.5"/>
    <rect x="18" y="18" width="324" height="194" rx="4" stroke="#60A5FA" stroke-opacity="0.25" stroke-dasharray="4 4"/>
    <circle cx="110" cy="115" r="48" stroke="#60A5FA" stroke-opacity="0.6" stroke-width="1.5"/>
    <circle cx="110" cy="115" r="24" stroke="#93C5FD" stroke-opacity="0.7" stroke-width="1.5"/>
    <path d="M 110 55 L 110 175 M 50 115 L 170 115" stroke="#60A5FA" stroke-opacity="0.35" stroke-width="1"/>
    <rect x="195" y="55" width="120" height="58" rx="4" fill="#173A6A" stroke="#60A5FA" stroke-opacity="0.5"/>
    <path d="M 210 84 L 228 84 L 238 68 L 252 100 L 266 76 L 278 84 L 300 84" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="195" y="132" width="120" height="10" rx="2" fill="#3B82F6" fill-opacity="0.35"/>
    <rect x="195" y="152" width="88" height="10" rx="2" fill="#3B82F6" fill-opacity="0.25"/>
    <rect x="195" y="172" width="104" height="10" rx="2" fill="#3B82F6" fill-opacity="0.2"/>
  </g>

  <!-- Central ESP32 + Robotics Carrier PCB -->
  <g transform="translate(450, 145)">
    <rect x="0" y="0" width="340" height="390" rx="4" fill="url(#pcb)" stroke="#60A5FA" stroke-opacity="0.65" stroke-width="2"/>
    <!-- Mounting holes -->
    <circle cx="22" cy="22" r="7" fill="#0A1D37" stroke="#93C5FD" stroke-width="2"/>
    <circle cx="318" cy="22" r="7" fill="#0A1D37" stroke="#93C5FD" stroke-width="2"/>
    <circle cx="22" cy="368" r="7" fill="#0A1D37" stroke="#93C5FD" stroke-width="2"/>
    <circle cx="318" cy="368" r="7" fill="#0A1D37" stroke="#93C5FD" stroke-width="2"/>

    <!-- Copper PCB traces -->
    <path d="M 85 110 L 52 110 L 52 245 L 85 245" stroke="#93C5FD" stroke-opacity="0.4" stroke-width="2"/>
    <path d="M 255 110 L 288 110 L 288 245 L 255 245" stroke="#93C5FD" stroke-opacity="0.4" stroke-width="2"/>
    <path d="M 170 50 L 170 84" stroke="#93C5FD" stroke-opacity="0.45" stroke-width="2"/>
    <path d="M 170 296 L 170 335" stroke="#93C5FD" stroke-opacity="0.45" stroke-width="2"/>

    <!-- ESP32 RF shield module -->
    <rect x="102" y="76" width="136" height="94" rx="2" fill="#CBD5E1" stroke="#94A3B8" stroke-width="2"/>
    <rect x="116" y="90" width="108" height="66" rx="2" fill="#E2E8F0"/>
    <text x="170" y="128" text-anchor="middle" fill="#0F172A" font-family="Montserrat, sans-serif" font-size="14" font-weight="700">ESP32-WROOM</text>
    <!-- PCB antenna meander -->
    <path d="M 122 64 L 122 50 L 142 50 L 142 64 L 162 64 L 162 50 L 182 50 L 182 64 L 202 64 L 202 50 L 218 50" stroke="#FBBF24" stroke-width="2.5" stroke-linecap="round"/>

    <!-- 0.96 OLED Module mounted below -->
    <rect x="78" y="198" width="184" height="114" rx="3" fill="#0B1628" stroke="#475569" stroke-width="2"/>
    <rect x="92" y="216" width="156" height="82" rx="2" fill="url(#screen)" stroke="#1E3A8A" stroke-width="1.5"/>
    <text x="170" y="246" text-anchor="middle" fill="#38BDF8" font-family="Montserrat, sans-serif" font-size="14" font-weight="700">VECTOR LAB</text>
    <path d="M 110 264 L 230 264" stroke="#1D4ED8" stroke-width="1"/>
    <text x="170" y="282" text-anchor="middle" fill="#93C5FD" font-family="Times New Roman, serif" font-size="11">I2C: 0x3C · READY</text>

    <!-- GPIO Header pins -->
    <g fill="#FBBF24">
      <rect x="44" y="102" width="12" height="6" rx="1"/>
      <rect x="44" y="120" width="12" height="6" rx="1"/>
      <rect x="44" y="138" width="12" height="6" rx="1"/>
      <rect x="44" y="156" width="12" height="6" rx="1"/>
      <rect x="44" y="174" width="12" height="6" rx="1"/>
      <rect x="44" y="192" width="12" height="6" rx="1"/>
      <rect x="44" y="210" width="12" height="6" rx="1"/>
      <rect x="44" y="228" width="12" height="6" rx="1"/>

      <rect x="284" y="102" width="12" height="6" rx="1"/>
      <rect x="284" y="120" width="12" height="6" rx="1"/>
      <rect x="284" y="138" width="12" height="6" rx="1"/>
      <rect x="284" y="156" width="12" height="6" rx="1"/>
      <rect x="284" y="174" width="12" height="6" rx="1"/>
      <rect x="284" y="192" width="12" height="6" rx="1"/>
      <rect x="284" y="210" width="12" height="6" rx="1"/>
      <rect x="284" y="228" width="12" height="6" rx="1"/>
    </g>

    <!-- USB-C port -->
    <rect x="142" y="362" width="56" height="28" rx="4" fill="#94A3B8" stroke="#E2E8F0" stroke-width="1.5"/>
  </g>

  <!-- Articulated Robotics Servo Arm Silhouette on Right -->
  <g transform="translate(830, 180)">
    <rect x="70" y="280" width="150" height="40" rx="2" fill="#1E3A8A" stroke="#60A5FA" stroke-width="1.5"/>
    <rect x="108" y="220" width="74" height="64" rx="2" fill="#172E59" stroke="#60A5FA" stroke-width="1.5"/>
    <circle cx="145" cy="240" r="16" fill="#2563EB" stroke="#93C5FD" stroke-width="2"/>
    <path d="M 145 240 L 82 140" stroke="#93C5FD" stroke-width="18" stroke-linecap="round"/>
    <path d="M 145 240 L 82 140" stroke="#1E40AF" stroke-width="10" stroke-linecap="round"/>
    <circle cx="82" cy="140" r="14" fill="#2563EB" stroke="#BFDBFE" stroke-width="2"/>
    <path d="M 82 140 L 185 88" stroke="#93C5FD" stroke-width="14" stroke-linecap="round"/>
    <path d="M 82 140 L 185 88" stroke="#1D4ED8" stroke-width="7" stroke-linecap="round"/>
    <circle cx="185" cy="88" r="11" fill="#38BDF8" stroke="#E0F2FE" stroke-width="2"/>
    <!-- Gripper jaws -->
    <path d="M 194 82 L 235 64 L 248 76" stroke="#BFDBFE" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 194 94 L 235 112 L 248 100" stroke="#BFDBFE" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
