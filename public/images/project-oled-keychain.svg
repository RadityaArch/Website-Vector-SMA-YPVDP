<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EEF4FC"/>
      <stop offset="100%" stop-color="#DCE8F8"/>
    </linearGradient>
    <linearGradient id="pcb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#93B4E2" fill-opacity="0.45"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#dots)"/>

  <!-- Keyring loop -->
  <circle cx="400" cy="108" r="44" stroke="#94A3B8" stroke-width="10"/>
  <circle cx="400" cy="108" r="44" stroke="#E2E8F0" stroke-width="3"/>

  <!-- Keychain PCB Body (sharper architectural corners) -->
  <rect x="235" y="145" width="330" height="365" rx="6" fill="url(#pcb)" stroke="#1E40AF" stroke-width="3"/>
  <rect x="247" y="157" width="306" height="341" rx="3" stroke="#60A5FA" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- Brass eyelet -->
  <circle cx="400" cy="184" r="14" fill="#F6F9FE" stroke="#F59E0B" stroke-width="5"/>

  <!-- 0.96 inch OLED module -->
  <rect x="275" y="218" width="250" height="176" rx="4" fill="#0B1628" stroke="#475569" stroke-width="2"/>
  <!-- 4 header solder pads -->
  <g fill="#FBBF24">
    <circle cx="355" cy="234" r="4.5"/>
    <circle cx="385" cy="234" r="4.5"/>
    <circle cx="415" cy="234" r="4.5"/>
    <circle cx="445" cy="234" r="4.5"/>
  </g>
  <text x="400" y="251" text-anchor="middle" fill="#94A3B8" font-family="Times New Roman, serif" font-size="10">GND  VCC  SCL  SDA</text>

  <!-- Active OLED Pixel Screen: Pixel Art Smiley Face (Non-Text) -->
  <rect x="293" y="260" width="214" height="114" rx="2" fill="#040B14" stroke="#1E3A8A" stroke-width="1.5"/>
  <!-- Top indicator bar pixels (yellow zone) -->
  <g fill="#FACC15">
    <rect x="312" y="269" width="6" height="6"/>
    <rect x="321" y="269" width="6" height="6"/>
    <rect x="330" y="269" width="6" height="6"/>
    <rect x="476" y="269" width="12" height="6"/>
  </g>
  <!-- Pixel Smiley Face (cyan OLED matrix) -->
  <g fill="#38BDF8">
    <!-- Top rim -->
    <rect x="380" y="284" width="40" height="5"/>
    <rect x="370" y="289" width="10" height="5"/>
    <rect x="420" y="289" width="10" height="5"/>
    <!-- Side rims -->
    <rect x="365" y="294" width="5" height="44"/>
    <rect x="430" y="294" width="5" height="44"/>
    <!-- Bottom rim -->
    <rect x="370" y="338" width="10" height="5"/>
    <rect x="420" y="338" width="10" height="5"/>
    <rect x="380" y="343" width="40" height="5"/>
    <!-- Left eye -->
    <rect x="382" y="302" width="8" height="11"/>
    <!-- Right eye -->
    <rect x="410" y="302" width="8" height="11"/>
    <!-- Pixel smile -->
    <rect x="381" y="322" width="6" height="5"/>
    <rect x="387" y="327" width="26" height="5"/>
    <rect x="413" y="322" width="6" height="5"/>
  </g>

  <!-- Bottom silkscreen and tactile switch -->
  <rect x="330" y="420" width="140" height="34" rx="3" fill="#172E59" stroke="#60A5FA" stroke-opacity="0.45"/>
  <circle cx="362" cy="437" r="7.5" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/>
  <rect x="384" y="434" width="66" height="6" rx="1" fill="#60A5FA" fill-opacity="0.6"/>
  <text x="400" y="484" text-anchor="middle" fill="#93C5FD" font-family="Montserrat, sans-serif" font-size="11" font-weight="600">VECTOR · OLED 0.96"</text>
</svg>
